<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Prochains passages — TAG Grenoble</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  #board{width:min(100vw,160vh);height:auto;display:block;background:#000}
  .label{fill:#fff;font-family:Arial,Helvetica,sans-serif}
  .eta{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:27px}
  .eta2{font-size:23px}
  .stopname{font-size:19px}
  #status{font-size:12.7px;fill:#fff}
  #clock{font-size:28.7px;fill:#fff;font-variant-numeric:tabular-nums}
  .trackA{fill:#0078bb}.trackB{fill:#009833}
  .station{fill:#fff;stroke:#000;stroke-width:1}
  .arrow{fill:#fff}
  @media(max-aspect-ratio: 4/3){#board{width:100vw} .stopname{font-size:22px}.eta{font-size:30px}}
</style>
</head>
<body>
<svg id="board" viewBox="0 0 1280 800" role="img" aria-label="Prochains passages des trams A et B">
<rect width="1280" height="800" fill="#000"/>
<text class="label" x="210" y="50" font-size="28.7">Prochains passages</text>
<text id="clock" x="1080" y="31" text-anchor="end">--:--</text>
<text id="status" x="1080" y="52" text-anchor="end">Chargement des données TAG…</text>
<rect x="0" y="66" width="1280" height="1.6" fill="#d8d8d8"/>
<!-- Ligne B : barre et arrêts, disposition calquée sur la maquette -->
<g id="lineB">
 <rect class="trackB" x="281.449" y="235.586" width="717.1" height="15.936" rx="6"/>
 <circle class="station" cx="520.482" cy="243.283" r="15.936"/>
 <circle class="station" cx="759.515" cy="243.283" r="15.936"/>
 <text class="label stopname" x="252.749" y="220.511" text-anchor="end">Palais de Justice – Gare</text>
 <text class="label stopname" x="925.194" y="220.511">Saint-Bruno</text>
 <text id="b-left-1" class="eta" x="485" y="290" text-anchor="middle">—</text>
 <text id="b-left-2" class="eta eta2" x="485" y="327" text-anchor="middle">—</text>
 <text id="b-right-1" class="eta" x="795" y="290" text-anchor="middle">—</text>
 <text id="b-right-2" class="eta eta2" x="795" y="327" text-anchor="middle">—</text>
</g>
<!-- Ligne A -->
<g id="lineA">
 <rect class="trackA" x="281.449" y="621.165" width="717.1" height="15.936" rx="6"/>
 <circle class="station" cx="520.498" cy="628.856" r="15.936"/>
 <circle class="station" cx="759.531" cy="628.856" r="15.936"/>
 <text class="label stopname" x="209.5" y="606.146">Berriat – Le Magasin</text>
 <text class="label stopname" x="974.584" y="606.146">Saint-Bruno</text>
 <text id="a-left-1" class="eta" x="485" y="675" text-anchor="middle">—</text>
 <text id="a-left-2" class="eta eta2" x="485" y="712" text-anchor="middle">—</text>
 <text id="a-right-1" class="eta" x="795" y="675" text-anchor="middle">—</text>
 <text id="a-right-2" class="eta eta2" x="795" y="712" text-anchor="middle">—</text>
</g>
</svg>
<script>
(function(){
  const COLORS={A:"#0078bb",B:"#009833"};
  const REFRESH_MS=20000, COUNT=2;
  const STOPS={
    "b-left":{codes:["SEM:2076","SEM:0802","SEM:2077"],line:"B"},
    "b-right":{codes:["SEM:2030","SEM:2031"],line:"B"},
    "a-left":{codes:["SEM:0923","SEM:0924","SEM:2032","SEM:2033"],line:"A"},
    "a-right":{codes:["SEM:2030","SEM:2031"],line:"A"}
  };
  function tick(){
    const d=new Date();
    document.getElementById("clock").textContent=
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function getLine(g){
    const p=g && g.pattern;
    if(!p)return "";
    if(p.shortName==="A"||p.shortName==="B")return p.shortName;
    const id=String(p.id||"").split(":");
    return id.length>1 && (id[1]==="A"||id[1]==="B") ? id[1] : "";
  }
  async function fetchStop(code){
    const r=await fetch("https://data.mobilites-m.fr/api/routers/default/index/stops/"+encodeURIComponent(code)+"/stoptimes");
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }
  async function departures(stopKey, cfg){
    const all=await Promise.all(cfg.codes.map(c=>fetchStop(c).catch(()=>[])));
    const seen=new Set(), deps=[];
    all.flat().forEach(g=>{
      if(getLine(g)!==cfg.line)return;
      (g.times||[]).forEach(t=>{
        const sec=t.serviceDay+(t.realtimeDeparture ?? t.scheduledDeparture);
        const ms=sec*1000;
        if(!Number.isFinite(ms)||ms<Date.now()-30000)return;
        const key=t.tripId||String(ms)+":"+(g.pattern&&g.pattern.id);
        if(seen.has(key))return;
        seen.add(key);
        deps.push({ms,realtime:!!t.realtime});
      });
    });
    return deps.sort((a,b)=>a.ms-b.ms).slice(0,COUNT);
  }
  function etaText(dep){
    if(!dep)return "Aucun passage";
    const min=Math.max(0,Math.round((dep.ms-Date.now())/60000));
    return min<=0?"À l’approche":min+" min"+(dep.realtime?"":" *");
  }
  async function refresh(){
    let successes=0;
    const keys=Object.keys(STOPS);
    await Promise.all(keys.map(async key=>{
      const cfg=STOPS[key];
      try{
        const deps=await departures(key,cfg); successes++;
        for(let i=0;i<COUNT;i++){
          const el=document.getElementById(key+"-"+(i+1));
          if(el)el.textContent=deps[i]?etaText(deps[i]):(i===0?"Aucun passage":"");
        }
      }catch(e){
        document.getElementById(key+"-1").textContent="Indisponible";
        document.getElementById(key+"-2").textContent="";
      }
    }));
    document.getElementById("status").textContent=successes===keys.length?"Données TAG à jour":"Données TAG partiellement disponibles";
  }
  tick();refresh();setInterval(tick,1000);setInterval(refresh,REFRESH_MS);
})();
</script>
</body>
</html>
