<script>
(() => {
  "use strict";
  const REFRESH_MS = 20000;
  // Arrêts configurés avec les codes TAG déjà utilisés dans la version fonctionnelle.
  // Plusieurs quais/codes sont regroupés afin de récupérer les passages disponibles.
  const STOP_CONFIG = {
    bLeft:  { codes:["SEM:2076","SEM:0802","SEM:2077"], line:"B" },
    bRight: { codes:["SEM:2030","SEM:2031"], line:"B" },
    aLeft:  { codes:["SEM:0923","SEM:0924","SEM:2032","SEM:2033"], line:"A" },
    aRight: { codes:["SEM:2030","SEM:2031"], line:"A" }
  };
  const $ = id => document.getElementById(id);
  function updateClock(){
    const d=new Date();
    $("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function lineOf(g){
    const p=g && g.pattern;
    if(!p)return "";
    if(p.shortName==="A"||p.shortName==="B")return p.shortName;
    const parts=String(p.id||"").split(":");
    return parts.length>1 && ["A","B"].includes(parts[1]) ? parts[1] : "";
  }
  async function fetchStop(code){
    const r=await fetch("https://data.mobilites-m.fr/api/routers/default/index/stops/"+encodeURIComponent(code)+"/stoptimes");
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }
  function directionKey(pattern){
    // L'API peut fournir directionId, headsign/desc ou un identifiant de pattern.
    return String(pattern.directionId ?? pattern.desc ?? pattern.name ?? pattern.id ?? "sens-inconnu");
  }
  async function getDepartures(cfg){
    const responses=await Promise.all(cfg.codes.map(code=>fetchStop(code).catch(()=>[])));
    const dirs=new Map();
    for(const groups of responses){
      for(const g of groups.flat ? groups.flat() : groups){
        if(lineOf(g)!==cfg.line)continue;
        const p=g.pattern||{}, key=directionKey(p);
        if(!dirs.has(key))dirs.set(key,{label:p.desc||p.name||"",deps:[],seen:new Set()});
        const dir=dirs.get(key);
        for(const t of (g.times||[])){
          const seconds=Number(t.serviceDay||0)+Number(t.realtimeDeparture ?? t.scheduledDeparture);
          const ms=seconds*1000;
          if(!Number.isFinite(ms)||ms<Date.now()-30000)continue;
          const trip=String(t.tripId||ms+":"+p.id);
          if(dir.seen.has(trip))continue;
          dir.seen.add(trip);
          dir.deps.push({ms,realtime:t.realtime!==false});
        }
      }
    }
    return [...dirs.values()]
      .map(d=>({...d,deps:d.deps.sort((a,b)=>a.ms-b.ms)}))
      .filter(d=>d.deps.length)
      .sort((a,b)=>a.deps[0].ms-b.deps[0].ms)
      .slice(0,2);
  }
  function eta(dep){
    if(!dep)return "—";
    const mins=Math.max(0,Math.round((dep.ms-Date.now())/60000));
    return mins<=0?"À l'approche":mins+" min";
  }
  function setTime(id,dep){ if($(id))$(id).textContent=eta(dep); }
  async function refresh(){
    let ok=0;
    await Promise.all(Object.entries(STOP_CONFIG).map(async ([key,cfg])=>{
      try{
        const dirs=await getDepartures(cfg);
        // Les deux blocs de texte de chaque arrêt correspondent aux deux sens.
        // Chaque sens affiche ses deux prochains passages.
        const f=dirs[0]?.deps||[], b=dirs[1]?.deps||[];
        setTime(key+"Forward1",f[0]); setTime(key+"Forward2",f[1]);
        setTime(key+"Back1",b[0]); setTime(key+"Back2",b[1]);
        ok++;
      }catch(e){
        [key+"Forward1",key+"Forward2",key+"Back1",key+"Back2"].forEach(id=>{if($(id))$(id).textContent="—";});
      }
    }));
    $("status").textContent=ok===4?"Données TAG à jour":"Données TAG partiellement disponibles";
  }
  updateClock(); refresh();
  setInterval(updateClock,1000);
  setInterval(refresh,REFRESH_MS);
})();
</script>
