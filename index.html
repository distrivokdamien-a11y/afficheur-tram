<script>
/* JavaScript ES5 pour compatibilite avec les navigateurs Android anciens. */
(function () {
  var REFRESH_MS = 20000;
  var API_BASE = "https://data.mobilites-m.fr/api/routers/default/index/stops/";

  /* Les noms sont ceux de la maquette. Les codes ci-dessous sont conserves
     de la version precedente : ils doivent correspondre aux arrêts voulus. */
  var STOP_CONFIG = {
    bLeft:  { codes: ["SEM:2076", "SEM:0802", "SEM:2077"], line: "B", label: "Oxford" },
    bRight: { codes: ["SEM:2030", "SEM:2031"], line: "B", label: "Plaine des sports" },
    aLeft:  { codes: ["SEM:0923", "SEM:0924", "SEM:2032", "SEM:2033"], line: "A", label: "Fontaine la Poya" },
    aRight: { codes: ["SEM:2030", "SEM:2031"], line: "A", label: "Étoile" }
  };

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(id, value) {
    var el = byId(id);
    if (el) {
      if (typeof el.textContent !== "undefined") el.textContent = value;
      else if (typeof el.innerText !== "undefined") el.innerText = value;
      else if (el.firstChild) el.firstChild.nodeValue = value;
    }
  }

  function setStatus(value) {
    setText("status", value);
  }

  function twoDigits(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function updateClock() {
    var d = new Date();
    setText("clock", twoDigits(d.getHours()) + "h" + twoDigits(d.getMinutes()));
  }

  function updateLabels() {
    var keys = ["bLeft", "bRight", "aLeft", "aRight"];
    var i, cfg, labelIds;
    for (i = 0; i < keys.length; i++) {
      cfg = STOP_CONFIG[keys[i]];
      if (keys[i] === "bLeft") labelIds = "stop-b-left";
      else if (keys[i] === "bRight") labelIds = "stop-b-right";
      else if (keys[i] === "aLeft") labelIds = "stop-a-left";
      else labelIds = "stop-a-right";
      setText(labelIds, cfg.label);
    }
  }

  function lineOf(group) {
    var p = group && group.pattern ? group.pattern : {};
    var name = p.shortName || p.routeShortName || "";
    var parts;
    if (name === "A" || name === "B") return name;
    parts = String(p.id || "").split(":");
    if (parts.length > 1 && (parts[1] === "A" || parts[1] === "B")) return parts[1];
    return "";
  }

  function directionKey(pattern) {
    var p = pattern || {};
    if (p.directionId !== undefined && p.directionId !== null && p.directionId !== "") {
      return "direction:" + String(p.directionId);
    }
    if (p.headsign) return "headsign:" + String(p.headsign);
    if (p.desc) return "desc:" + String(p.desc);
    if (p.name) return "name:" + String(p.name);
    if (p.id) return "pattern:" + String(p.id);
    return "direction:unknown";
  }

  function requestStop(code, callback) {
    var xhr, finished = false;
    function finish(data, success) {
      if (finished) return;
      finished = true;
      callback(data, success);
    }
    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", API_BASE + encodeURIComponent(code) + "/stoptimes", true);
      xhr.onreadystatechange = function () {
        var parsed;
        if (xhr.readyState !== 4 || finished) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            parsed = JSON.parse(xhr.responseText);
            finish(parsed, true);
          } catch (e) {
            finish(null, false);
          }
        } else {
          finish(null, false);
        }
      };
      xhr.onerror = function () { finish(null, false); };
      xhr.ontimeout = function () { finish(null, false); };
      try { xhr.timeout = 12000; } catch (ignoreTimeout) {}
      xhr.send(null);
    } catch (e2) {
      finish(null, false);
    }
  }

  function findDirection(groups, key) {
    var i;
    for (i = 0; i < groups.length; i++) {
      if (groups[i].key === key) return groups[i];
    }
    return null;
  }

  function sortDepartures(deps) {
    deps.sort(function (a, b) { return a.ms - b.ms; });
  }

  function addResponseData(data, cfg, directions, seenTrips) {
    var i, g, p, key, dir, times, j, t, rawDeparture, serviceDay, seconds, ms, tripKey;
    if (!data || typeof data.length !== "number") return;
    for (i = 0; i < data.length; i++) {
      g = data[i];
      if (!g || lineOf(g) !== cfg.line) continue;
      p = g.pattern || {};
      key = directionKey(p);
      dir = findDirection(directions, key);
      if (!dir) {
        dir = { key: key, deps: [] };
        directions.push(dir);
      }
      times = g.times || [];
      for (j = 0; j < times.length; j++) {
        t = times[j] || {};
        if (t.realtimeDeparture !== undefined && t.realtimeDeparture !== null) {
          rawDeparture = t.realtimeDeparture;
        } else {
          rawDeparture = t.scheduledDeparture;
        }
        serviceDay = Number(t.serviceDay || 0);
        seconds = serviceDay + Number(rawDeparture);
        ms = seconds * 1000;
        if (!isFinite(ms) || isNaN(ms) || ms < new Date().getTime() - 30000) continue;
        tripKey = t.tripId ? String(t.tripId) : String(ms) + ":" + String(p.id || key);
        tripKey = key + "|" + tripKey;
        if (seenTrips[tripKey]) continue;
        seenTrips[tripKey] = true;
        dir.deps.push({ ms: ms, realtime: t.realtime !== false });
      }
    }
  }

  function getDepartures(cfg, callback) {
    var total = cfg.codes.length;
    var finished = 0;
    var successes = 0;
    var directions = [];
    var seenTrips = {};
    var i;
    if (!total) {
      callback({ ok: false, directions: [] });
      return;
    }
    for (i = 0; i < cfg.codes.length; i++) {
      (function (code) {
        requestStop(code, function (data, success) {
          if (success) {
            successes++;
            addResponseData(data, cfg, directions, seenTrips);
          }
          finished++;
          if (finished === total) {
            var usable = [], j;
            for (j = 0; j < directions.length; j++) {
              sortDepartures(directions[j].deps);
              if (directions[j].deps.length) usable.push(directions[j]);
            }
            /* Ordre stable : la direction ne change pas simplement parce
               qu'un tram arrive plus tôt que l'autre. */
            usable.sort(function (a, b) {
              if (a.key < b.key) return -1;
              if (a.key > b.key) return 1;
              return 0;
            });
            callback({ ok: successes > 0, directions: usable.slice(0, 2) });
          }
        });
      })(cfg.codes[i]);
    }
  }

  function eta(dep) {
    var minutes;
    if (!dep) return "—";
    minutes = Math.max(0, Math.round((dep.ms - new Date().getTime()) / 60000));
    if (minutes <= 0) return "À l'approche";
    return minutes + " min";
  }

  function updateTimes(key, result) {
    var forward = result.directions.length > 0 ? result.directions[0].deps : [];
    var back = result.directions.length > 1 ? result.directions[1].deps : [];
    setText(key + "Forward1", eta(forward[0]));
    setText(key + "Forward2", eta(forward[1]));
    setText(key + "Back1", eta(back[0]));
    setText(key + "Back2", eta(back[1]));
  }

  function refresh() {
    var keys = ["bLeft", "bRight", "aLeft", "aRight"];
    var pending = keys.length;
    var ok = 0;
    setStatus("Récupération des données TAG…");
    function oneDone(result) {
      if (result.ok) ok++;
      pending--;
      if (pending === 0) {
        if (ok === keys.length) setStatus("Données TAG actualisées");
        else if (ok > 0) setStatus("Données TAG partiellement disponibles");
        else setStatus("Erreur de connexion aux données TAG");
      }
    }
    var i;
    for (i = 0; i < keys.length; i++) {
      (function (key) {
        var cfg = STOP_CONFIG[key];
        getDepartures(cfg, function (result) {
          updateTimes(key, result);
          oneDone(result);
        });
      })(keys[i]);
    }
  }

  /* Une erreur inattendue ne doit pas laisser croire que les données sont à jour. */
  window.onerror = function () {
    setStatus("Erreur JavaScript");
    return false;
  };

  updateClock();
  updateLabels();
  setStatus("Démarrage…");
  refresh();
  window.setInterval(updateClock, 1000);
  window.setInterval(refresh, REFRESH_MS);
})();
</script>
