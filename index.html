<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Affichage lignes A &amp; B — TAG Grenoble</title>
  <style>
    :root {
      --fond: #000;
      --texte: #fff;
      --ligne-a: #00a2ff;
      --ligne-b: #00d4aa;
      --texte-secondaire: #b8c2cc;
      --separateur: #30343a;
      --police: "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--fond);
      color: var(--texte);
      font-family: var(--police);
      min-height: 100vh;
      padding: clamp(14px, 3vw, 40px);
      display: flex;
      flex-direction: column;
      gap: clamp(26px, 4vh, 40px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--separateur);
      padding-bottom: 14px;
    }
    h1 { font-size: clamp(1.2rem, 3vw, 1.8rem); }
    .infos { text-align: right; color: var(--texte-secondaire); }
    #clock { font-size: clamp(1.2rem, 3vw, 1.7rem); font-variant-numeric: tabular-nums; }
    #status { font-size: .8rem; margin-top: 4px; }
    .ligne { width: 100%; max-width: 1100px; margin-inline: auto; }
    .ligne__entete {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 12px;
    }
    .pastille {
      width: 50px; height: 50px; min-width: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px; font-weight: 700;
    }
    .ligne--a .pastille { background: var(--ligne-a); }
    .ligne--b .pastille { background: var(--ligne-b); }
    .ligne__destinations {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 24px;
      width: 100%;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600;
    }
    .ligne__destinations span { min-width: 0; }
    .tableau { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: clamp(.9rem, 1.8vw, 1.125rem); }
    .tableau th, .tableau td { padding: 14px 16px; text-align: left; }
    .tableau th:first-child, .tableau td:first-child { padding-left: 66px; }
    .tableau thead th { font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 600; padding-bottom: 18px; }
    .tableau thead th:first-child { width: 28%; }
    .tableau thead th:not(:first-child) { width: 36%; }
    .tableau tbody th { font-weight: 400; color: var(--texte-secondaire); padding-top: 22px; overflow-wrap: anywhere; }
    .tableau tbody td { padding-top: 22px; font-variant-numeric: tabular-nums; }
    .temps { color: var(--texte); font-weight: 600; }
    .minutes { font-size: 1.35em; }
    .unite { font-size: .75em; color: var(--texte-secondaire); margin-left: 4px; }
    .detail { display: block; color: var(--texte-secondaire); font-size: .72rem; font-weight: 400; margin-top: 4px; }
    .vide { color: #858b93; font-size: .9em; font-weight: 400; }
    .ligne--a .temps .minutes { color: var(--ligne-a); }
    .ligne--b .temps .minutes { color: var(--ligne-b); }
    .ligne__separateur { border: 0; border-top: 1px solid var(--separateur); margin-top: 6px; }
    @media (max-width: 600px) {
      body { padding: 14px 12px; gap: 28px; }
      .pastille { width: 40px; height: 40px; min-width: 40px; font-size: 22px; }
      .ligne__entete { gap: 12px; }
      .ligne__destinations { gap: 0 12px; font-size: 1rem; }
      .tableau th, .tableau td { padding: 12px 6px; }
      .tableau th:first-child, .tableau td:first-child { padding-left: 4px; }
      .tableau thead th:first-child { width: 31%; }
      .tableau thead th:not(:first-child) { width: 34.5%; }
      .tableau tbody th { font-size: .85rem; }
      .detail { font-size: .65rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🚋 Prochains passages</h1>
    <div class="infos">
      <div id="clock">--:--</div>
      <div id="status" role="status" aria-live="polite">Chargement des données TAG…</div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <script>
    // Codes de quais utilisés par l'afficheur d'origine.
    var STOPS = [
      { name: "Palais de Justice – Gare", codes: ["SEM:2076", "SEM:0802", "SEM:2077"] },
      { name: "Saint-Bruno", codes: ["SEM:2030", "SEM:2031"] },
      { name: "Berriat – Le Magasin", codes: ["SEM:0923", "SEM:0924", "SEM:2032", "SEM:2033"] }
    ];
    var LINE_LAYOUT = [
      { line: "A", css: "a", stops: ["Saint-Bruno", "Berriat – Le Magasin"] },
      { line: "B", css: "b", stops: ["Palais de Justice – Gare", "Saint-Bruno"] }
    ];
    var NEXT_COUNT = 3;
    var REFRESH_MS = 20000;
    var cachedDepartures = {};

    function clockTick() {
      var d = new Date();
      document.getElementById("clock").textContent =
        ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    }

    function fetchStop(code) {
      return fetch("https://data.mobilites-m.fr/api/routers/default/index/stops/" + code + "/stoptimes")
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
    }

    function collectDepartures(stop) {
      var promises = stop.codes.map(fetchStop);
      return Promise.all(promises.map(function (p) {
        return p.catch(function () { return []; });
      })).then(function (results) {
        var seen = {};
        var deps = [];
        results.forEach(function (groups) {
          (groups || []).forEach(function (g) {
            var pattern = g.pattern || {};
            // L'API fournit la ligne dans l'identifiant, par exemple SEM:B:0:...
            var line = (pattern.id || "").split(":")[1];
            if (line !== "A" && line !== "B") return;

            (g.times || []).forEach(function (t) {
              var seconds = t.serviceDay + (
                t.realtimeDeparture != null ? t.realtimeDeparture : t.scheduledDeparture
              );
              var departureMs = seconds * 1000;
              if (!Number.isFinite(departureMs) || departureMs < Date.now() - 30000) return;

              var key = t.tripId || (line + "|" + departureMs + "|" + (pattern.lastStopName || pattern.desc || ""));
              if (seen[key]) return;
              seen[key] = true;

              deps.push({
                line: line,
                dest: pattern.lastStopName || pattern.headsign || pattern.desc || pattern.shortDesc || "Destination inconnue",
                ms: departureMs,
                realtime: !!t.realtime,
                delay: t.departureDelay
              });
            });
          });
        });
        deps.sort(function (a, b) { return a.ms - b.ms; });
        return deps;
      });
    }

    function getStop(name) {
      return STOPS.find(function (s) { return s.name === name; });
    }

    function etaText(departure) {
      var mins = Math.max(0, Math.round((departure.ms - Date.now()) / 60000));
      if (mins <= 0) {
        return '<span class="minutes">À l’approche</span>' +
          (departure.realtime ? '<span class="detail">Temps réel</span>' : '<span class="detail">Horaire théorique</span>');
      }
      return '<span class="minutes">' + mins + '</span><span class="unite">min</span>' +
        '<span class="detail">' + (departure.realtime ? 'Temps réel' : 'Horaire théorique') + '</span>';
    }

    function destinationGroups(deps, line) {
      var names = [];
      deps.filter(function (d) { return d.line === line; }).forEach(function (d) {
        if (names.indexOf(d.dest) === -1) names.push(d.dest);
      });
      return names.slice(0, 2);
    }

    function nextFor(stopName, line, destination) {
      var deps = cachedDepartures[stopName] || [];
      return deps.filter(function (d) {
        return d.line === line && d.dest === destination;
      }).slice(0, NEXT_COUNT);
    }

    function renderLine(layout) {
      var allForLine = [];
      layout.stops.forEach(function (stopName) {
        allForLine = allForLine.concat((cachedDepartures[stopName] || []).filter(function (d) {
          return d.line === layout.line;
        }));
      });
      var destinations = destinationGroups(allForLine, layout.line);
      while (destinations.length < 2) destinations.push(null);

      var rows = destinations.map(function (dest, i) {
        var cells = layout.stops.map(function (stopName) {
          if (!dest) return '<td class="temps"><span class="vide">—</span></td>';
          var next = nextFor(stopName, layout.line, dest)[0];
          return '<td class="temps">' + (next ? etaText(next) : '<span class="vide">Aucun passage</span>') + '</td>';
        }).join("");
        return '<tr><th scope="row">' + (dest || "Destination") + '</th>' + cells + '</tr>';
      }).join("");

      return '<section class="ligne ligne--' + layout.css + '" aria-label="Ligne ' + layout.line + '">' +
        '<div class="ligne__entete"><div class="pastille" aria-hidden="true">' + layout.line + '</div>' +
        '<div class="ligne__destinations">' + layout.stops.map(function (s) {
          return '<span>' + s + '</span>';
        }).join("") + '</div></div>' +
        '<table class="tableau"><thead><tr><th scope="col">Terminus</th>' +
        layout.stops.map(function (s) { return '<th scope="col">' + s + '</th>'; }).join("") +
        '</tr></thead><tbody>' + rows + '</tbody></table>' +
        '<hr class="ligne__separateur"></section>';
    }

    function render() {
      var status = document.getElementById("status");
      status.textContent = "Actualisation…";
      Promise.all(STOPS.map(function (stop) {
        return collectDepartures(stop).then(function (deps) {
          return { name: stop.name, deps: deps };
        });
      })).then(function (results) {
        cachedDepartures = {};
        var activeCount = 0;
        results.forEach(function (r) {
          cachedDepartures[r.name] = r.deps;
          if (r.deps.length) activeCount++;
        });
        document.getElementById("app").innerHTML = LINE_LAYOUT.map(renderLine).join("");
        status.textContent = activeCount === STOPS.length
          ? "Données TAG à jour"
          : "Données reçues pour " + activeCount + "/" + STOPS.length + " arrêts";
      }).catch(function (err) {
        status.textContent = "Erreur réseau — nouvelle tentative…";
        console.error("Erreur de mise à jour de l’afficheur TAG :", err);
      });
    }

    clockTick();
    render();
    setInterval(clockTick, 1000);
    setInterval(render, REFRESH_MS);
  </script>
</body>
</html>
